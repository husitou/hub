<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝 1級の用語テスト - 学習ポータル</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
          },
          animation: {
            'blob': 'blob 10s infinite alternate',
            'pulse-subtle': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            blob: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Glassmorphism custom styles */
    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    
    .glass-header {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
    }

    .card-hover-effect {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card-hover-effect:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 20px 30px -10px rgba(99, 102, 241, 0.25);
    }

    /* Gradient background animation mesh */
    .bg-mesh {
      background-color: #f8fafc;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(236, 72, 153, 0.12) 0px, transparent 50%);
    }
  </style>
</head>

<body class="bg-mesh min-h-full font-sans text-slate-800 antialiased selection:bg-indigo-500 selection:text-white relative overflow-x-hidden flex flex-col justify-between">

  <!-- Ambient Light Blobs in Background -->
  <div class="fixed top-0 left-1/4 w-96 h-96 bg-indigo-300/40 rounded-full blur-3xl pointer-events-none animate-blob"></div>
  <div class="fixed top-1/3 right-1/4 w-96 h-96 bg-purple-300/40 rounded-full blur-3xl pointer-events-none animate-blob animation-delay-2000"></div>
  <div class="fixed bottom-10 left-1/3 w-96 h-96 bg-pink-300/30 rounded-full blur-3xl pointer-events-none animate-blob animation-delay-4000"></div>

  <!-- Main Container -->
  <div class="relative z-10 max-w-xl mx-auto px-4 py-8 sm:py-12 w-full">

    <!-- Header Section -->
    <header class="text-center mb-8 sm:mb-10">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/80 border border-indigo-100 shadow-sm text-indigo-700 text-xs sm:text-sm font-semibold mb-4 backdrop-blur-sm">
        <span class="flex h-2 w-2 rounded-full bg-indigo-500 animate-ping"></span>
        <span>検定対策ポータル</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight flex items-center justify-center gap-2">
        <span>📝 1級の用語テスト</span>
      </h1>
      <p class="mt-2 text-sm sm:text-base text-slate-600 font-medium">
        合格を目指す日々の学習ハブサイト
      </p>
    </header>

    <!-- Motivational Quick Banner -->
    <div class="glass-card rounded-2xl p-4 sm:p-5 mb-6 shadow-sm border border-white/80 flex items-center justify-between">
      <div class="flex items-center gap-3.5">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 text-white flex items-center justify-center shadow-md shadow-indigo-500/20 text-lg font-bold">
          <i class="fa-solid fa-fire"></i>
        </div>
        <div>
          <div class="text-xs text-slate-500 font-medium">学習ステータス</div>
          <div class="text-sm font-bold text-slate-800">今日も1歩前進！</div>
        </div>
      </div>
      <div class="text-right">
        <span class="inline-block px-3 py-1 rounded-lg bg-indigo-50 text-indigo-700 font-bold text-xs">
          全2回分 公開中
        </span>
      </div>
    </div>

    <!-- Test List Container -->
    <main class="space-y-4">
      
      <!-- Test Item 1 -->
      <a href="https://husitou.github.io/zyousyotesutoyou1/" target="_blank" rel="noopener noreferrer" 
         class="group glass-card block rounded-2xl p-5 shadow-sm hover:shadow-xl border border-white/80 card-hover-effect relative overflow-hidden">
        <!-- Card Left Accent Bar -->
        <div class="absolute top-0 left-0 bottom-0 w-2 bg-gradient-to-b from-indigo-500 to-blue-500 rounded-l-2xl"></div>

        <div class="flex items-center justify-between pl-2">
          <div class="flex items-center gap-4">
            <!-- Icon Badge -->
            <div class="w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold text-lg group-hover:bg-indigo-600 group-hover:text-white transition-colors duration-300 shadow-inner">
              01
            </div>

            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-100 text-emerald-800">
                  <i class="fa-solid fa-check text-[9px] mr-1"></i>公開中
                </span>
                <span class="text-xs text-slate-400 font-mono">第1回</span>
              </div>
              <h2 class="text-lg font-bold text-slate-800 group-hover:text-indigo-600 transition-colors">
                第1回テスト
              </h2>
            </div>
          </div>

          <!-- Action Arrow -->
          <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition-all transform group-hover:translate-x-1 shadow-sm">
            <i class="fa-solid fa-arrow-right text-sm"></i>
          </div>
        </div>

        <div class="mt-3 pl-2 pt-3 border-t border-slate-100/60 flex items-center justify-between text-xs text-slate-500">
          <span class="flex items-center gap-1.5 font-mono text-slate-400 truncate max-w-[200px] sm:max-w-xs">
            <i class="fa-solid fa-link text-[10px]"></i> husitou.github.io/zyousyotesutoyou1
          </span>
          <span class="text-indigo-600 font-semibold group-hover:underline flex items-center gap-1">
            テストを開始 <i class="fa-solid fa-chevron-right text-[10px]"></i>
          </span>
        </div>
      </a>

      <!-- Test Item 2 -->
      <a href="https://husitou.github.io/konbutesutoyou2/" target="_blank" rel="noopener noreferrer" 
         class="group glass-card block rounded-2xl p-5 shadow-sm hover:shadow-xl border border-white/80 card-hover-effect relative overflow-hidden">
        <!-- Card Left Accent Bar -->
        <div class="absolute top-0 left-0 bottom-0 w-2 bg-gradient-to-b from-purple-500 to-pink-500 rounded-l-2xl"></div>

        <div class="flex items-center justify-between pl-2">
          <div class="flex items-center gap-4">
            <!-- Icon Badge -->
            <div class="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center font-bold text-lg group-hover:bg-purple-600 group-hover:text-white transition-colors duration-300 shadow-inner">
              02
            </div>

            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-100 text-emerald-800">
                  <i class="fa-solid fa-check text-[9px] mr-1"></i>公開中
                </span>
                <span class="text-xs text-slate-400 font-mono">第2回</span>
              </div>
              <h2 class="text-lg font-bold text-slate-800 group-hover:text-purple-600 transition-colors">
                第2回テスト
              </h2>
            </div>
          </div>

          <!-- Action Arrow -->
          <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center group-hover:bg-purple-600 group-hover:text-white transition-all transform group-hover:translate-x-1 shadow-sm">
            <i class="fa-solid fa-arrow-right text-sm"></i>
          </div>
        </div>

        <div class="mt-3 pl-2 pt-3 border-t border-slate-100/60 flex items-center justify-between text-xs text-slate-500">
          <span class="flex items-center gap-1.5 font-mono text-slate-400 truncate max-w-[200px] sm:max-w-xs">
            <i class="fa-solid fa-link text-[10px]"></i> husitou.github.io/konbutesutoyou2
          </span>
          <span class="text-purple-600 font-semibold group-hover:underline flex items-center gap-1">
            テストを開始 <i class="fa-solid fa-chevron-right text-[10px]"></i>
          </span>
        </div>
      </a>

    </main>

    <!-- Tips Card -->
    <div class="mt-8 rounded-2xl bg-indigo-900/5 border border-indigo-200/50 p-4 text-center">
      <p class="text-xs text-slate-600 flex items-center justify-center gap-2">
        <i class="fa-regular fa-lightbulb text-amber-500 text-sm"></i>
        スマホの「ホーム画面に追加」をするとアプリ感覚で開けます
      </p>
    </div>

  </div>

  <!-- Footer -->
  <footer class="py-6 text-center text-xs text-slate-400 relative z-10">
    <p>© 1級の用語テスト ポータル</p>
  </footer>

</body>
</html>
